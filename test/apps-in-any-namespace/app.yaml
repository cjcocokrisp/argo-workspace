apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: apps
spec:
  project: app-namespaces
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: app1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
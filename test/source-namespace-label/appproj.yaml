apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: source-namespaces
  namespace: argocd
spec:
  description: "testing out source namespace labels for apps in any namespace"
  destinations:
    - server: "*"
      namespace: "*"
  sourceNamespaces:
    - test-ns1
    - test-ns2
    - test3
    - test-ns4
    - test-ns6
  sourceRepos:
  - "https://github.com/argoproj/argocd-example-apps.git"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
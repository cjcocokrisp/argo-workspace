apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: test-ns1
spec:
  project: source-namespaces
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app2
  namespace: test-ns7
spec:
  project: source-namespaces-labeled
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: test-ns7
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

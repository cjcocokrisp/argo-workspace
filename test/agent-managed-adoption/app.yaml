apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adoption-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cjcocokrisp/argo-workspace
    targetRevision: HEAD
    path: test/agent-managed-adoption/resources
  destination:
    name: in-cluster
    namespace: test
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
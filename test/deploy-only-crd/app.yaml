apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crd-with-no-cr
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cjcocokrisp/argo-workspace
    targetRevision: HEAD
    path: test/deploy-only-crd/resources
  destination:
    name: in-cluster
    namespace: default
  syncPolicy: {}

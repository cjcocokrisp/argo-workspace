apiVersion: batch/v1
kind: Job
metadata:
  name: test-job-1
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 1
  template:
    spec:
      containers:
        - name: busybox
          image: busybox
          command: ["echo", "this is job 1"]
      restartPolicy: "Never"

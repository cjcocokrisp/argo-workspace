name: Check for word
on:
  pull_request:
    branches:
      - environments/scs-next
      - environments/scs
jobs:
  wordcheck:
    name: Check for a word in manifests
    runs-on: ubuntu:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check for DEBLOB in the manifests produced by the source hydrator
        run: |
          ! grep -q "DEBLOB" hydrated/manifest.yaml


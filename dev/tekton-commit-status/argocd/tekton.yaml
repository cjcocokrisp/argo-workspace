apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tcs-test-tekton-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cjcocokrisp/argo-workspace
    targetRevision: HEAD
    path: dev/tekton-commit-status/tekton
  destination:
    name: in-cluster
    namespace: tcs-testing
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

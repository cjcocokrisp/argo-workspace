apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: promotion-strategy
  labels:
    key: valuejustforcinganupdate
spec:
  environments:
    - autoMerge: false
      branch: environments/tcs
  gitRepositoryRef:
    name: argo-workspace-git-repo
  orderCommitStatusRef:
    group: promoter.argoproj.io
    kind: DependentsSuccessfulCommitStatus
    name: tcs
  proposedCommitStatuses:
    - key: "tcs-test-proposed-proposed"
    - key: "tcs-test-task-input"

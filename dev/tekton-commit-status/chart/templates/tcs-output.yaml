apiVersion: promoter.argoproj.io/v1alpha1
kind: TektonCommitStatus
metadata:
  name: tcs-task-output
spec:
  promotionStrategyRef:
    name: "promotion-strategy"
  key: "tcs-test-task-output"
  tektonResourceRef:
    kind: "Task"
    name: "output"
    serviceAccount: default
  expression: 'Result.str == "commitstatus"'
  expectedResults:
    - key: str
      expression: 'Result == "commitstatus"'

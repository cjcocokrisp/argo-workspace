apiVersion: promoter.argoproj.io/v1alpha1
kind: TektonCommitStatus
metadata:
  name: tcs-task-input
spec:
  promotionStrategyRef:
    name: "promotion-strategy"
  key: "tcs-test-proposed-proposed"
  tektonResourceRef:
    kind: "Task"
    name: "input"
    serviceAccount: default
    params:
      - branch: "{{ "{{" }} .Branch {{ "}}" }}"
      - sha: "{{ "{{" }} .TargetedSha {{ "}}" }}"
  pruneRun: true

apiVersion: v1
data:
  change: change
  key: value
  test: test
  testing: test
kind: ConfigMap
metadata:
  name: configmap
---
apiVersion: v1
kind: Service
metadata:
  name: service
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nginx
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    example: update
  name: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - image: nginx:latest
          name: nginx
          ports:
            - containerPort: 80
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: DependentsSuccessfulCommitStatus
metadata:
  name: scs-dependent
spec:
  key: dependents-successful
  promotionStrategyRef:
    name: promotion-strategy
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: GitRepository
metadata:
  name: argo-workspace-git-repo
spec:
  github:
    name: argo-workspace
    owner: cjcocokrisp
  scmProviderRef:
    name: github-scm-provider
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: promotion-strategy
spec:
  environments:
    - autoMerge: false
      branch: environments/scs
  gitRepositoryRef:
    name: argo-workspace-git-repo
  orderCommitStatusRef:
    group: promoter.argoproj.io
    kind: DependentsSuccessfulCommitStatus
    name: scs-dependent
  proposedCommitStatuses:
    - key: scs-commit-status-test
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: SCMCheckCommitStatus
metadata:
  name: scs-commit-status
spec:
  key: scs-commit-status-test
  promotionStrategyRef:
    name: promotion-strategy
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: ScmProvider
metadata:
  name: github-scm-provider
spec:
  github:
    appID: 4349556
  secretRef:
    name: gitops-promoter-gh-app

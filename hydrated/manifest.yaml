apiVersion: v1
data:
  key: these promotions were done through argocd operator deployed instances of argocd and the gitops promoter
kind: ConfigMap
metadata:
  labels:
    test: test
  name: configmap
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: default
spec:
  ports:
    - nodePort: 31000
      port: 80
      targetPort: 80
  selector:
    app: nginx
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - image: nginx:latest
          name: nginx
          ports:
            - containerPort: 80
